plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = '0.1.0-alpha.26+26.1.2'
group = 'br.lumaworks'
base { archivesName = 'luma-works' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
neoForge {
 version = '26.1.2.126'
 runs { client { client() }; server { server(); programArgument '--nogui' } }
 mods { lumaworks { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { from('LICENSE.txt'); from('third-party') { into 'META-INF/licenses' } }
sourceSets.main.java.srcDir 'src/client/java'
// Build-only API; never bundled or required at runtime. Pinned official Sodium release.
repositories { maven { url = 'https://api.modrinth.com/maven' } }
configurations { sodiumDistribution }
dependencies { sodiumDistribution 'maven.modrinth:sodium:zg4YQ9EL' }
def sodiumApi = layout.buildDirectory.file('sodium-api/sodium-api.jar')
def extractSodiumApi = tasks.register('extractSodiumApi', Sync) {
    from({ zipTree(configurations.sodiumDistribution.singleFile) })
    include 'META-INF/jarjar/*-mod.jar'
    eachFile { path = 'sodium-api.jar' }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('sodium-api')
}
dependencies { compileOnly files(sodiumApi).builtBy(extractSodiumApi) }

if (project.hasProperty('smokeTest')) {
    sourceSets.main.java.srcDir 'src/smoke/java'
    neoForge.runs.server.systemProperty 'lumaworks.smoke', 'true'
}
if (project.hasProperty('showcase')) {
    sourceSets.main.java.srcDir 'src/showcase/java'
    neoForge.runs.server.gameDirectory = file('run-showcase')
}

repositories { maven { url = "https://maven.blamejared.com" } }
dependencies { compileOnly "mezz.jei:jei-26.1.2-common-api:29.47.0.111" }

if (project.hasProperty('standaloneAudit')) {
    sourceSets { standaloneAudit { java.srcDir 'src/standaloneAudit/java' } }
    sourceSets.standaloneAudit.java.srcDir 'src/rgbAudit/java'
    sourceSets.standaloneAudit.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    tasks.named('compileStandaloneAuditJava') { dependsOn tasks.named('classes') }
}

// Local full-pack verification code is excluded from every release artifact.
if (project.hasProperty('packAudit')) {
    sourceSets { packAudit { java.srcDir 'src/packAudit/java' } }
    sourceSets.packAudit.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output +
        files(fileTree(providers.gradleProperty('testInstance').get() + '/mods') { include '*.jar' })
    tasks.named('compilePackAuditJava') { dependsOn tasks.named('classes') }
}

// Generate original assets from reviewed sources on a fresh checkout, including CI.
def resourcePython = System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'
tasks.register('generateLightingResources', Exec) {
    workingDir projectDir
    commandLine resourcePython, 'tools/generate_resources.py'
    inputs.files(fileTree('tools') { include '*.py', 'finishing_resources.json' })
    outputs.dirs('src/main/resources/assets/lumaworks', 'src/main/resources/data')
}
tasks.register('verifyLightingResources', Exec) {
    dependsOn 'generateLightingResources'
    workingDir projectDir
    commandLine resourcePython, 'tools/verify_resources.py', 'src/main/resources'
}
tasks.named('processResources') { dependsOn 'verifyLightingResources' }

tasks.named('sourcesJar') { dependsOn 'verifyLightingResources' }
